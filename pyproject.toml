[build-system]
requires = ["setuptools>=78,<79"]
build-backend = "setuptools.build_meta"

[project]
name = "cuhkx-competition"
version = "0.1.0"
description = "Reproducible solution workspace for the CUHK-X Large Model Track."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = ["Pillow>=10,<13", "PyYAML>=6,<7"]

[project.scripts]
cuhkx = "cuhkx.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10", "numpy>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
